name: Verify and deploy site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.164.0

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install Hugo Extended
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Run contracts and unit tests
        run: node --test tests/*.test.js

      - name: Build production site
        run: hugo --gc --minify --environment production --cleanDestinationDir

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/posts/curtain-homepage-design-and-deployment/index.html
          test -s public/posts/curtain-homepage-design-and-deployment/homepage-architecture.svg
          test -s public/posts/curtain-homepage-design-and-deployment/deployment-pipeline.svg
          test -n "$(find public/assets/css -type f -name '*.css' -size +0c -print -quit)"
          test -n "$(find public/assets/js -type f -name '*.js' -size +0c -print -quit)"
          grep -q 'data-period=day' public/index.html
          grep -q 'data-period=week' public/index.html
          grep -q 'data-period=month' public/index.html
          grep -q 'data-period=year' public/index.html

      - name: Upload production artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: public/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy production
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://estevancyber.net/
    concurrency:
      group: estevancyber-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: site-${{ github.sha }}
          path: _site

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST in the production environment}"
          : "${VPS_USER:?Set VPS_USER in the production environment}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY in the production environment}"
          : "${VPS_HOST_KEY:?Set VPS_HOST_KEY in the production environment}"
          VPS_PORT="${VPS_PORT:-22}"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT > 0 && VPS_PORT < 65536 ))
          printf 'VPS_PORT=%s\n' "$VPS_PORT" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$VPS_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -l -f "$HOME/.ssh/known_hosts"

      - name: Upload artifact to isolated staging
        shell: bash
        run: |
          set -euo pipefail
          target="${VPS_USER}@${VPS_HOST}"
          release_dir="/tmp/estevancyber-release-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          ssh -i "$HOME/.ssh/id_deploy" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$target" "install -d -m 0755 '$release_dir'"
          rsync --archive --delete \
            -e "ssh -i $HOME/.ssh/id_deploy -p $VPS_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            _site/ "${target}:${release_dir}/"
          printf 'RELEASE_DIR=%s\n' "$release_dir" >> "$GITHUB_ENV"

      - name: Activate release with rollback protection
        shell: bash
        run: |
          set -euo pipefail
          target="${VPS_USER}@${VPS_HOST}"
          ssh -i "$HOME/.ssh/id_deploy" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$target" "sudo bash -s -- '$RELEASE_DIR' '$GITHUB_SHA'" \
            < scripts/deploy-site.sh
