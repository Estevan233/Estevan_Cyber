baseURL: "https://blog.estevancyber.net/"
languageCode: "zh-cn"
title: "Estevan Cyber"
theme: "PaperMod"

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  defaultTheme: light
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true

  profileMode:
    enabled: false
    Title: "Estevan Cyber"
    subtitle: "一起学习与成长..."
    buttons:
      - name: 文章
        url: /posts/
      - name: 搜索
        url: /search/
      - name: 问答
        url: /ask/
      - name: 项目
        url: /projects/
      - name: 工具
        url: https://tools.estevancyber.net/
      - name: 关于
        url: /about/
menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 5
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: search
      name: 搜索
      url: /search/
      weight: 20
    - identifier: ask
      name: 问答
      url: /ask/
      weight: 25
    - identifier: projects
      name: 项目
      url: /projects/
      weight: 30
    - identifier: tools
      name: 工具
      url: https://tools.estevancyber.net/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50
