<section class="ec-side-section ec-progress" aria-labelledby="ec-progress-title">
  <div class="ec-side-section__heading">
    <p>Local time</p>
    <h2 id="ec-progress-title">时间进度</h2>
  </div>
  <div class="ec-progress__list">
    {{ range (slice
      (dict "period" "day" "label" "今日")
      (dict "period" "week" "label" "本周")
      (dict "period" "month" "label" "本月")
      (dict "period" "year" "label" "今年")
    ) }}
    <div class="ec-progress__item" data-period="{{ .period }}">
      <div>
        <span>{{ .label }}</span>
        <strong data-progress-value>0%</strong>
      </div>
      <progress max="100" value="0" aria-label="{{ .label }}时间进度">0%</progress>
    </div>
    {{ end }}
  </div>
  <noscript><p class="ec-progress__noscript">启用 JavaScript 后显示本地时间进度。</p></noscript>
</section>
