<section class="ec-side-section ec-progress" aria-labelledby="ec-progress-title">
  <div class="ec-side-section__heading">
    <p>Local time</p>
    <h2 id="ec-progress-title">年度进度</h2>
  </div>
  <div class="ec-progress__list">
    <div class="ec-progress__item" data-period="year">
      <div>
        <span>今年已经走过</span>
        <strong data-progress-value>0%</strong>
      </div>
      <progress max="100" value="0" aria-label="今年时间进度">0%</progress>
    </div>
  </div>
  <noscript><p class="ec-progress__noscript">启用 JavaScript 后显示本地时间进度。</p></noscript>
</section>
